name: Draft Windows release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Unique version, for example 0.1.0-preview.1 (without v)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: draft-windows-release
  cancel-in-progress: false

jobs:
  draft:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: 'true'
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_COMMIT: ${{ github.sha }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release request
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') { throw 'Run releases from main.' }
          if ($env:RELEASE_VERSION -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$') {
            throw 'Provide a version such as 0.1.0-preview.1 without a v prefix.'
          }
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Test baseline (local service checks are opt-in)
        run: dotnet test PyrionKnowledgePipeline.sln --configuration Release --logger 'trx;LogFileName=tests.trx' --results-directory artifacts/test-results
      - name: Package Windows application
        run: ./scripts/package-release.ps1 -Version $env:RELEASE_VERSION
      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release
          path: |
            artifacts/releases/${{ inputs.version }}/*.zip
            artifacts/releases/${{ inputs.version }}/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Create draft prerelease for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseRoot = Join-Path 'artifacts/releases' $env:RELEASE_VERSION
          $archive = Join-Path $releaseRoot "PyrionKnowledgePipeline-$env:RELEASE_VERSION-win-x64.zip"
          $checksums = Join-Path $releaseRoot 'SHA256SUMS.txt'
          gh release create "v$env:RELEASE_VERSION" $archive $checksums --draft --prerelease --target $env:RELEASE_COMMIT --title "Pyrion Knowledge Pipeline $env:RELEASE_VERSION" --notes-file docs/release-readme.md
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed. Inspect existing releases before retrying.' }
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-test-results
          path: artifacts/test-results/*.trx
          if-no-files-found: warn
          retention-days: 14
