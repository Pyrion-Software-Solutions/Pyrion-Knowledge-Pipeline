name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: 'true'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore PyrionKnowledgePipeline.sln
      - name: Build
        run: dotnet build PyrionKnowledgePipeline.sln --configuration Release --no-restore
      - name: Test baseline (local service checks are opt-in)
        run: dotnet test PyrionKnowledgePipeline.sln --configuration Release --no-build --logger 'trx;LogFileName=tests.trx' --results-directory artifacts/test-results
      - name: Verify Windows packaging
        run: ./scripts/package-release.ps1 -Version 0.0.0-ci
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-test-results
          path: artifacts/test-results/*.trx
          if-no-files-found: warn
          retention-days: 14
